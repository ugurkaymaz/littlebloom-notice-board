name: WordPress Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP Syntax (${{ matrix.php }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Stage production plugin files
        shell: bash
        run: |
          mkdir -p build/littlebloom-notice-board
          cp littlebloom-notice-board.php readme.txt build/littlebloom-notice-board/
          cp -a assets includes vendor docs build/littlebloom-notice-board/
          test -f build/littlebloom-notice-board/littlebloom-notice-board.php
          test -f build/littlebloom-notice-board/vendor/freemius/start.php

      - name: WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./build/littlebloom-notice-board
